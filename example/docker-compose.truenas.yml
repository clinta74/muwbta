name: muwbta

# TrueNAS SCALE deployment (custom app / docker compose).
#
# Differs from docker-compose.prod.yml in two ways, both deliberate:
#   - Host ports are remapped (7180, 5434) because TrueNAS itself owns 80/443 and may run its
#     own Postgres.
#   - prometheus/grafana are omitted. Monitoring is optional; the backup sidecar is not.
#
# There is no ollama service and the builder AI assist is off (2026-10-01). The NAS's RTX 3060
# went to Familiar, whose model and speech services need ~10.4 GB of its 12 - not enough room
# left for the assist's ~8.4 GB. The assist was always optional: with Assist__Enabled false the
# server registers no assist endpoints and the builder's Suggest buttons don't appear. To bring
# it back, restore the ollama service and the Assist__* keys from git history (see
# tools/ollama/README.md) and give it a GPU or accept CPU speeds.
#
# Hardware assumptions: i5 9600K (6c/6t, no HT), 48 GB DDR4, models on the `ssd` pool.

services:
  postgres:
    image: postgres:18
    container_name: muwbta-postgres
    restart: always
    networks:
      - muwbta-network
    environment:
      POSTGRES_DB: muwbta
      POSTGRES_USER: muwbta
      # Must match DatabaseConnection__Password on `web` and PGPASSWORD on `backup`.
      POSTGRES_PASSWORD:
      POSTGRES_INITDB_ARGS: '-c timezone=UTC -c shared_buffers=256MB -c max_connections=200'
    ports:
      # Loopback only. `web` and `backup` reach Postgres as postgres:5432 over the compose
      # network; publishing on 0.0.0.0 put the database on the whole LAN for no benefit.
      # Remove this line entirely if you never need a client on the NAS itself.
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backups:/backups:rw
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U muwbta -d muwbta
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    shm_size: 256mb
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        labels: service=postgres
        max-file: '3'
        max-size: 10m

  web:
    image: candrews74/muwbta-server:latest
    container_name: muwbta-web
    restart: always
    pull_policy: always
    networks:
      - muwbta-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseConnection__Host: postgres
      DatabaseConnection__Port: '5432'
      DatabaseConnection__Database: muwbta
      DatabaseConnection__User: muwbta
      DatabaseConnection__Password:
      Logging__LogLevel__Default: Warning
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
      # Two different limits, and the names have to be exact: the binder ignores what it does not
      # recognise, so a misspelt key takes effect nowhere and says nothing.
      # How many characters the account may have at all, and how many may be in world at once.
      Sessions__MaxCharactersPerAccount: '8'
      Sessions__MaxConcurrentCharactersPerAccount: '3'
      # Three missed 20s heartbeats before a quiet client is treated as link-dead. Zero disables
      # the sweep and falls back to the kernel's retransmission timeout, which is minutes.
      Sessions__HeartbeatTimeoutSeconds: '60'
      # No global session cap: Sessions__MaxConcurrentSessions was never a setting, and a hundred
      # would contradict the 200 concurrent sessions PLAN.md §11 targets and has now measured.
      Auth__CookieName: muwbta.session
      Auth__SessionTimeoutMinutes: '20160'
      Auth__RevalidationIntervalSeconds: '60'
      # Wrong passwords against one account before the next attempt waits; the first pause and its
      # ceiling, in seconds. Per account, on top of the per-address rate limit. Zero disables.
      Auth__LoginFailuresBeforeBackoff: '5'
      Auth__LoginBackoffSeconds: '30'
      Auth__LoginBackoffMaxSeconds: '900'
      # Personal access tokens (docs/PAT-AND-MCP.md). The ceiling on how long one may be given -
      # there is no 'never expires' - how many live ones an account may hold, and how stale the
      # last-used stamp may get before a request writes it.
      Auth__TokenMaxLifetimeDays: '90'
      Auth__TokensPerAccount: '10'
      Auth__TokenLastUsedIntervalMinutes: '60'
      # Which proxies' X-Forwarded-* headers to believe. The compose network is the nginx hop; the
      # TLS terminator in front of port 7180 - on another host - goes in KnownProxies, or the walk
      # stops at it and every visitor shares its address for rate limiting. Both empty means the
      # headers are ignored.
      Proxy__KnownNetworks: '172.25.0.0/16'
      Proxy__KnownProxies: ''
      # 300, not 30. The engine default is 360 pulses (90s); 30 is shorter than that and drops a
      # phone that has merely been backgrounded (MOBILE.md section 6). Program.cs applies any
      # positive value here, so this one is live and a wrong value is a real regression.
      Engine__LinkDeadGraceSeconds: '300'
      #
      # Engine__StartingRoom is deliberately absent. Room keys are dotted
      # ("aldenmoor.millbrook.north-gate"); "hall@0.0.0" fails RoomKey.TryParse, so Program.cs
      # silently keeps the seeded room. Set it only with a key that actually parses - an ignored
      # setting that reads as configured is the trap EngineContracts.cs warns about.
      #
      # The builder AI assist (PLAN.md §13) is off on the NAS - see the note at the top of this
      # file. Off is also the default; it is spelled out so nobody reads its absence as an
      # oversight. No BaseUrl or Model: there is no ollama service for them to name, and a key
      # that configures nothing is the trap EngineContracts.cs warns about.
      Assist__Enabled: 'false'
      SwaggerEnabled: 'false'
    volumes:
      - ./logs:/app/logs:rw
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # The .NET GC reads the cgroup limit and sizes its heap from it. Unset, it sizes against all
    # 48 GB and lets the heap grow far past what this process needs.
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        labels: service=web
        max-file: '5'
        max-size: 50m

  client:
    image: candrews74/muwbta-client:latest
    container_name: muwbta-client
    restart: always
    pull_policy: always
    networks:
      - muwbta-network
    depends_on:
      web:
        condition: service_healthy
    ports:
      # 443, not 80: the front proxy terminates TLS and re-encrypts to here, so the scheme this
      # nginx forwards to the API is https and the session cookie gets its Secure flag. The
      # certificate is self-signed at container start and nothing validates it (see
      # client/docker-entrypoint.d/05-selfsign.sh for what that does and does not protect).
      - '7180:443'
    healthcheck:
      test:
        - CMD
        - wget
        - '-q'
        - '-O'
        - '-'
        - http://localhost/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        labels: service=client
        max-file: '3'
        max-size: 50m

  backup:
    # Nightly pg_dump that proves itself by restoring into a scratch DB and counting rows;
    # a dump that will not restore is deleted rather than kept (tools/backup/backup.sh).
    #
    # Requires tools/backup/backup.sh to exist next to this file ON THE NAS. If you deploy from
    # the published images and have no repo checkout there, copy the script to a dataset and
    # point the mount at an absolute path instead, e.g. /mnt/tank/muwbta/tools/backup:/scripts:ro
    image: postgres:18
    container_name: muwbta-backup
    restart: always
    networks:
      - muwbta-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: muwbta
      PGDATABASE: muwbta
      PGPASSWORD:
      BACKUP_AT_HOUR: '3'
      BACKUP_KEEP: '30'
    volumes:
      - ./tools/backup:/scripts:ro
      - ./backups:/backups:rw
    entrypoint:
      - /bin/sh
      - /scripts/backup.sh
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        labels: service=backup
        max-file: '3'
        max-size: 10m

networks:
  muwbta-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  pgdata:
    driver: local
