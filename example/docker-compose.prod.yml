name: muwbta

# Production docker-compose configuration
# All settings are hardcoded below - edit this file to change values
# No .env file needed

services:
  postgres:
    # PLAN.md §6: PostgreSQL 18, pinned for version consistency across dev/test/prod
    image: postgres:18
    container_name: muwbta-postgres
    restart: always
    networks:
      - muwbta-network
    environment:
      # Database initialization - EDIT THESE VALUES
      POSTGRES_DB: muwbta
      POSTGRES_USER: muwbta
      POSTGRES_PASSWORD: change_this_password_in_production
      POSTGRES_INITDB_ARGS: >-
        -c timezone=UTC
        -c shared_buffers=256MB
        -c max_connections=200
    ports:
      # Production: remove this port mapping (use internal network only)
      # Dev: expose to localhost only
      - "127.0.0.1:5432:5432"
    volumes:
      # PG 18+ stores data in a major-version subdirectory, so mount at /var/lib/postgresql
      # See https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
      # Optional: backup directory for pg_dump
      - ./backups:/backups:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muwbta -d muwbta"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Recommended production settings
    shm_size: 256mb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres"

  web:
    # ASP.NET Core backend API server
    # REQUIRED: Set via environment variables:
    #   - REGISTRY (default: ghcr.io)
    #   - IMAGE_REPO (default: your-org/muwbta)
    #   - MUWBTA_IMAGE_TAG (default: latest)
    image: candrews74/muwbta-server:latest
    container_name: muwbta-web
    restart: always
    networks:
      - muwbta-network
    depends_on:
      postgres:
        condition: service_healthy
    # Port 8080 is only exposed internally; nginx proxies to it. Do not move it without also
    # setting BACKEND_ORIGIN on the client service - the client image defaults to http://web:8080,
    # and a mismatch here is a 502 from nginx with nothing wrong on either side individually.
    # For debugging, uncomment and set WEB_DEBUG_PORT:
    # ports:
    #   - "${WEB_DEBUG_PORT}:8080"
    environment:
      # ASP.NET Core runtime. No ASPNETCORE_URLS: the aspnet base image already listens on 8080,
      # which is what the client's proxy target and this file's health check both assume.
      ASPNETCORE_ENVIRONMENT: Production
      # Database connection parts - builder constructs from these in appsettings
      # Edit these to match postgres service above
      DatabaseConnection__Host: postgres
      DatabaseConnection__Port: "5432"
      DatabaseConnection__Database: muwbta
      DatabaseConnection__User: muwbta
      DatabaseConnection__Password: change_this_password_in_production
      # Logging
      Logging__LogLevel__Default: Warning
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
      # Sessions (PLAN.md §3.2)
      #
      # Two different limits, and the names have to be exact - the binder ignores a key it does
      # not recognise, so a misspelling takes effect nowhere and says nothing.
      #
      # How many characters this account may have at all:
      Sessions__MaxCharactersPerAccount: "8"
      # How many of them may be in the world at once, each holding an SSE connection:
      Sessions__MaxConcurrentCharactersPerAccount: "3"
      #
      # How long a client may go quiet before it is treated as link-dead. The client beats every
      # 20s, so this is three missed beats. Zero disables the sweep, and the server then falls
      # back to noticing a dropped connection only when the kernel gives up retransmitting -
      # measured at over sixteen minutes, proxy or no proxy (PLAN.md §11).
      Sessions__HeartbeatTimeoutSeconds: "60"
      #
      # There is deliberately no global session cap. A Sessions__MaxConcurrentSessions of 100 used
      # to sit here and bound to nothing - there is no such setting - and a hundred would now
      # contradict PLAN.md §11, which targets 200 concurrent sessions on one process and has
      # measured them being held.
      # Auth (PLAN.md §7.1)
      Auth__CookieName: muwbta.session
      Auth__SessionTimeoutMinutes: "20160"
      Auth__RevalidationIntervalSeconds: "60"
      # Wrong passwords against one account before the next attempt waits; the first pause and its
      # ceiling, in seconds. Per account, on top of the per-address rate limit. Zero disables.
      Auth__LoginFailuresBeforeBackoff: "5"
      Auth__LoginBackoffSeconds: "30"
      Auth__LoginBackoffMaxSeconds: "900"
      # Personal access tokens (docs/PAT-AND-MCP.md). The ceiling on how long one may be given -
      # there is no "never expires" - how many live ones an account may hold, and how stale the
      # last-used stamp may get before a request writes it.
      Auth__TokenMaxLifetimeDays: "90"
      Auth__TokensPerAccount: "10"
      Auth__TokenLastUsedIntervalMinutes: "60"
      # Which proxies' X-Forwarded-* headers to believe. The compose network is the one hop in this
      # file, so the nginx in front is trusted by its network. A TLS terminator outside compose - a
      # reverse proxy on another host - goes in KnownProxies, or the walk stops at it and every
      # visitor shares its address for rate limiting. Both empty means the headers are ignored.
      Proxy__KnownNetworks: "172.25.0.0/16"
      Proxy__KnownProxies: ""
      # Game engine
      #
      # These two did nothing until the Engine section was actually read (Program.cs). The old
      # values are worth knowing about rather than quietly replacing: 30 seconds was a shorter
      # grace than the engine's own 90-second default, and the starting room was "hall@0.0.0",
      # which is not a room key this build can parse — an invalid value is now ignored in favour
      # of the seeded starting room rather than crashing the host.
      #
      # 300 seconds because a phone that has been backgrounded for two minutes has been
      # interrupted, not disconnected (MOBILE.md §6). The cost is that a player who really has
      # gone stays in the world that much longer.
      Engine__LinkDeadGraceSeconds: "300"
      # Swagger (disable in production)
      SwaggerEnabled: "false"
    volumes:
      # Shared logs directory (optional)
      - ./logs:/app/logs:rw
    healthcheck:
      # Health endpoint provided by ASP.NET Core
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=web"

  backup:
    # Nightly pg_dump, verified by restoring it (PLAN.md §6, Phase 6).
    #
    # Plain postgres:18 rather than a backup image off the registry: the job needs pg_dump,
    # pg_restore, psql and a clock, and this image has all four at exactly the server's version.
    # A backup taken by an older pg_dump than the server is a restore that may not work.
    #
    # See tools/backup/backup.sh - it deletes any dump it could not restore, so a file in
    # ./backups has been proven at least once rather than merely written.
    image: postgres:18
    container_name: muwbta-backup
    restart: always
    networks:
      - muwbta-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: muwbta
      PGDATABASE: muwbta
      # Must match the postgres service above.
      PGPASSWORD: change_this_password_in_production
      BACKUP_AT_HOUR: "3"
      BACKUP_KEEP: "30"
    volumes:
      - ./tools/backup:/scripts:ro
      - ./backups:/backups:rw
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=backup"

  client:
    # React SPA frontend with nginx reverse proxy
    # Built from client/Dockerfile
    build:
      context: .
      dockerfile: client/Dockerfile
    image: candrews74/muwbta-client:latest
    container_name: muwbta-client
    restart: always
    networks:
      - muwbta-network
    depends_on:
      web:
        condition: service_healthy
    ports:
      # Public-facing web UI - EDIT PORT TO MATCH YOUR NEEDS
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
        labels: "service=client"

  prometheus:
    # Scrapes web:8080/metrics (PLAN.md §8, Phase 6). See tools/monitoring/prometheus.yml.
    #
    # Not published on a public port. /metrics is unauthenticated and so is this UI, and neither
    # is reachable from outside the compose network - nginx forwards only /api/ and /health. To
    # look at raw series, tunnel: ssh -L 9090:localhost:9090 <host>, after adding a
    # 127.0.0.1:9090:9090 mapping here.
    image: prom/prometheus:v3.6.0
    container_name: muwbta-prometheus
    restart: always
    networks:
      - muwbta-network
    volumes:
      - ./tools/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 90 days. The point of a histogram over a log line is answering "is it getting worse",
      # and that question needs more history than an incident does.
      - --storage.tsdb.retention.time=90d
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=prometheus"

  grafana:
    # The dashboard. Provisioned from tools/monitoring/grafana, so it survives a container
    # recreate and lives in git rather than only in Grafana's own database.
    image: grafana/grafana:12.2.0
    container_name: muwbta-grafana
    restart: always
    networks:
      - muwbta-network
    depends_on:
      - prometheus
    ports:
      # Bound to loopback: reach it over an SSH tunnel rather than exposing it. Grafana is not
      # part of the game and has no business on the public interface.
      - "3000:3000"
    environment:
      # CHANGE THIS. It is the admin account for everything the dashboard can see.
      GF_SECURITY_ADMIN_PASSWORD: change_this_password_in_production
      # Nobody is signing up for a metrics dashboard for one server.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./tools/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./tools/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:rw
      - grafana-data:/var/lib/grafana
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=grafana"

networks:
  muwbta-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  pgdata:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
